    <script>
        // Create a function removeEgg(foods) that takes an array of strings and returns an array where the string 'egg' is removed. Create this function using .filter() instead of a loop.
        // removeEgg(['egg','appple','egg','egg','ham']) => ['apple','ham']

        const arr = ['egg', 'appple', 'egg', 'egg', 'ham'];

        function removeEgg(food) {
            let newarr = [];
            let count = 0;
            newarr = food.filter((value) => {
                if (value === 'egg') {
                    if (count < 2) {
                        count++;
                        return false;
                    }
                    else {
                        return true;
                    }
                }
                else {
                    return true;
                }
            })
            console.log(newarr);
        }

        removeEgg(arr);
    </script>
