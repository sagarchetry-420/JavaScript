<!-- TodoList -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .js-output,
        .inputs {
            display: grid;
            grid-template-columns: 200px 200px 80px;
            column-gap: 10px;
            row-gap: 10px;
            align-items: center;
        }

        .inputs {
            margin: 0 0 10px 0;
            align-items: stretch;
        }

        .js-input,
        .js-date {
            font-size: 15px;
            padding: 6px;
        }

        .add-todo-btn {
            background-color: rgb(0, 106, 0);
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;

        }

        .delete-todo-btn {
            background-color: red;
            color: white;
            border: none;
            font-size: 15px;
            padding: 10px 10px;
        }
    </style>
</head>

<body>
    <p>Todo List</p>
    <div class="inputs">
        <input type="text" placeholder="Todo name" class="js-input">
        <input type="date" name="" id="" class="js-date">
        <button onclick="addTodo();" class="add-todo-btn">Add</button>
    </div>

    <div class="js-output"></div>
    <script>


        const todoList = JSON.parse(localStorage.getItem('value')) || [];
        renderList();
        function addTodo() {
            const inputElm = document.querySelector('.js-input');
            const dateElm = document.querySelector('.js-date');
            const date = dateElm.value;
            const name = inputElm.value;
            todoList.push({//name: name, date: date
                name, date
            });
            localStorage.setItem('value', JSON.stringify(todoList));
            //console.log(todoList);
            inputElm.value = '';

            //document.querySelector('.js-output').innerText = todoList ;
            renderList();
        }

        function renderList() {
            let todolistHTML = ``;

            for (let i = 0; i < todoList.length; i++) {
                let list = todoList[i];
                //const name = list.name;
                //const date = list.date;
                const { name, date } = list;
                todolistHTML += `
                <div>${name}</div>
                <div>${date}</div>   
                <button class="delete-todo-btn" onclick="deleteTodo(${i});">Delete</button>`;  //generating HTML using JS

            }
            //console.log(todolistHTML);
            document.querySelector('.js-output').innerHTML = todolistHTML;

        }


        // delete todo
        function deleteTodo(i) {
            todoList.splice(i, 1);
            localStorage.setItem('value', JSON.stringify(todoList));
            renderList();
        }

        // Create diffenrent files for all HTML, CSS and JS. 
        // Update the <link> and <script> elements to load.
        // Update the todo list to use localStorage (if we modify the todo list and refresh the page, the todo list should stay the same).
        // Hint: remember that locaStorage only supports strings. You can use JSON.stringify() to convert an array to a string.
    </script>
</body>

</html>
