<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="module">

        // Using DayJS, get the date 5 days after today and display it in the format : '<Month><Day of Month>'
        import dayjs from 'https://unpkg.com/dayjs@1.11.10/esm/index.js';
            const futureDate = dayjs().add(5, 'day').format('MMMM D');
            console.log(futureDate);

            //Calculate 1 month after today and display it in the same format as above
            const afterOneMonth = dayjs().add(1, 'month').format('MMMM D');
            console.log(afterOneMonth);

            // DayJS has a .subtract() method which subtracts time from a date. Calculate 1 month before today and display in the same fromat
            const beforeOneMonth = dayjs().subtract(1, 'month').format('MMMM D');
            console.log(beforeOneMonth);

            //Get a date from DayJS and display it in this fromat: '<Day of Week>' (The format should be 'Monday','Tuesday',etc.)
            const dayOfWeek = dayjs().format('dddd');
            console.log(dayOfWeek);

            // Create a function isWeekend(date) that takes a DayJS object, and returns whether the date is 'Saturday' or 'Sunday'.
            function isWeekend(date){
                const day = date.format('dddd');
                if(day === 'Saturday' || day === 'Sunday'){
                    return `Weekend and day is : ${day}`;
                }else return `Weekday : ${day}`;
            }
            console.log(isWeekend(dayjs('2026-01-03')));
    </script>
</body>
</html>
