<!-- Create a function countPositive(nums) that takes an array of numbers and returns how many numbers in the array are greater that 0.
 - countPositive([1,-3,5]) => 2
 - countPositive([-2,3,-5,7,10]) => 3 -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //const num = [1,-3,5];
        const num = [-2, 3, -5, 7, 10];

        countPositive(num);
        function countPositive(num) {
            let count = 0;
            for (let i = 0; i < num.length; i++) {
                if (num[i] >= 0) {
                    count++;
                }
            }
            console.log(`count of positive numbers in ${num} is : `, count);
        }
    </script>
</body>

</html>
