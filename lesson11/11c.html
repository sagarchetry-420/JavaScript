<!-- Create a function arraySwap(array) that takes an array and returns an array where the first and last values are swapped (or switched).
 - arraySwap([1,20,22,24,1]) => [5,20,22,24,1] 
 - arraySwap(['hi','hello','good']) => ['good', 'hello', 'hi'] -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //const arr = [1,20,22,24,5];
        const arr = ['hi', 'hello', 'good'];
        console.log('first with out swap: ', arr);
        let firstIndex = arr[0];
        let lastIndex = arr.length - 1;
        let temp = firstIndex;
        arr[0] = arr[lastIndex];
        arr[lastIndex] = temp;

        console.log('after swap: ', arr);
    </script>
</body>

</html>
