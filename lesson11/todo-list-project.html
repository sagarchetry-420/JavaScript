<!-- TodoList -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Todo List</p>
    <input type="text" placeholder="Todo name" class="js-input">
    <button onclick="addTodo();">Add</button>
    <div class="js-output"></div>

    <script>


        const todoList = [];
        renderList();
        function addTodo() {
            const inputElm = document.querySelector('.js-input');
            const name = inputElm.value;
            todoList.push(name);
            //console.log(todoList);
            inputElm.value = '';

            //document.querySelector('.js-output').innerText = todoList ;
            renderList();
        }

        function renderList() {
            let todolistHTML = ``;

            for (let i = 0; i < todoList.length; i++) {
                let list = todoList[i];
                todolistHTML += `<p>${list}</p>`;  //generating HTML using JS

            }
            console.log(todolistHTML);
            document.querySelector('.js-output').innerHTML = todolistHTML;

        }





    </script>
</body>

</html>
