<body>
    <script>
        // Create a function countWords(words) that takes an array of strings and returns an object with how many times each string appeared.
        // countWords(['apple', 'grape', 'apple']) => {apple: 2, grape:1} 
        // (hint: you can access a property using a variable: object[variable]; This uses the value inside the variable as the property name).

        const arr = ['apple', 'grape', 'apple'];
        let obj = {};

        countWords(arr);
        function countWords(arr) {
            
            for (let i = 0; i < arr.length; i++) {
                
                if (obj[arr[i]]) {
                    
                    obj[arr[i]]++;
                }
                else {
                    
                    obj[arr[i]] = 1;
                }
            }
            console.log(obj);

        }
    </script>
