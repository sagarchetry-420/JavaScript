<!-- Create a function getLastValue(array) that takes an array and returns the last value in the array. Hint: array indexes start at 0 so the last index is the number of values in the array minus 1
 (lastIndex = array.lenght-1).
 - getLastValue([1,20,22,24,5]) => 5
 - getLastValue(['hi','hello','good']) => 'good' -->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
        const arr = [1,20,22,24,5];
        const arrStr = ['hi','hello','good'];
        getLastValue(arrStr);

        function getLastValue(arr){
           const index = arr.length-1;
           console.log(arr[index]);
        }
    </script>
 </body>
 </html>
