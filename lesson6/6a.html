<!-- Create a variable called 'hour' and save the current hour of the day (use 24-hour format and save it as a number between 0 and 23). 
   - if hour is between 6 and 12, display 'good morning!' in the console
   - if hour is between 13 and 17, diaplay 'Good afternoon!' in the console
   - otherwise, display 'good night!' in the console -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // Continue above, create a variable called 'name' and save you name inside (as a string). Update the if-statement to display you name in each message. For example: 'Good morning ${name}!'.

        const name = 'sagar chetry';
        const hour = 10;
        if (hour >= 6 && hour <= 12) {
            console.log(`Good morning! ${name}`);
        }
        else if (hour >= 13 && hour <= 17) {

            console.log(`Good afternoon! ${name}`);
        }
        else { console.log(`Good night! ${name}`); }





    </script>
</body>

</html>
