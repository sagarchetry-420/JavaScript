<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let add = function () {
            console.log(2 + 3);
        }



        // Create a function runTwice(fun) that takes a function (as a parameter) and runs it twice.
        // runTwice(function(){console.log('12')}); => console.log('12') twice
        // runTwice(add); => console.log(5) twice

        runTwice(add);

        function runTwice(fun) {
            fun();
            fun();
        }

        runTwice(function () {
            console.log('12a');
        })



    </script>
</body>

</html>
