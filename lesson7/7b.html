<!-- Create a function convertlenght( length, from, to) that takes a number and a unit ('km' or 'miles') and converts the length to another unit ('km' or 'miles'). 
 Note: 1 mile = 1.6 km (approximately).
 - convertLenght( 50, 'miles','km') => '80 km'
 - convertLenght( 32, 'km', 'miles') => '20 miles'
 - convertLength( 50, 'km', 'km') => '50 km'-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let result;
        function convertLength(length, from, to) {
            if ((from === 'km') && (to === 'miles')) {
                result = length / 1.6;
                console.log(`${result} miles`);
            }
            else if ((from === 'miles') && (to === 'km')) {
                result = length * 1.6;
                console.log(`${result} km`);
            }
            else if (((from === 'miles') && (to === 'miles')) || ((from === 'km') && (to === 'km'))) {
                console.log(`${length} ${from}`);
            }
            else {
                console.log('you entered wrong unit!');

            }
        }
        convertLength(32, 'km', 'miles');
        convertLength(50, 'miles', 'km');
        convertLength(32, 'km', 'km');
        convertLength(32, 'miles', 'miles');
        convertLength(50, 'miles', 'km');
        convertLength(50, 'miles', 'kadm');

    </script>
</body>
