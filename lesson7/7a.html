<!-- Create a function called 'greet' that displays the message 'hello' in the console. Call this function a fe times using: greet();-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // add a parameter called 'name' to the 'greet' function and display the message: hello ${name}!. call the function a few times with different names
        greet('sagar');
        greet();
        greet();
        function greet(name){
            if(!name){
                console.log('hello there!');
            }
            else
            console.log(`hello ${name}!`);
        }
    </script>
</body>
</html>
