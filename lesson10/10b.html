    <style>
        .gaming-button {
            background-color: rgba(128, 128, 128, 0.237);
            border: none;
            padding: 8px 30px;
            border-radius: 6px;
            transition: background-color 0.15s;
            cursor: pointer;
        }

        /* .gaming-button:hover {
            background-color: rgba(70, 69, 69, 0.577);
        } */

        .gaming-button:active {
            background-color: rgba(128, 128, 128, 0.83);
        }

        .after-clicking {
            background-color: black;
            color: white;
            border-radius: 6px;
            border: none;
            padding: 8px 30px;
            transition: background-color 0.15s;
            cursor: pointer;
        }
    </style>

    <button class="js-gaming gaming-button" onclick="isToggled('.js-gaming');">Gaming</button>
    <button class="js-music gaming-button" onclick="isToggled('.js-music');">Music</button>
    <button class="js-tech gaming-button" onclick="isToggled('.js-tech');">Tech</button>

    <script>

        // Algorithm

        /* 
        Which button did the user click?
            Find that button
                Is it already selected?
                    if (yes)
                    {
                        Turn off old button
                        select new button}
                    
                    if (no){
                        Turn off this button
                    }
        */

        function isToggled(btn) {
            const btnElm = document.querySelector(btn);
            if (!btnElm.classList.contains('after-clicking')) {

                turnOff();
                btnElm.classList.add('after-clicking');
            }
            else {
                btnElm.classList.remove('after-clicking');
            }

        }

        function turnOff() {
            const prev = document.querySelector('.after-clicking');
            if (prev) {
                prev.classList.remove('after-clicking');
            }
        }
