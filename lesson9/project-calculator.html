<!-- Lets build a calculator , we will add local storage --> 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p class="js-result"></p>
    <button onclick=" updateCalculation('1');">1</button>
    <button onclick=" updateCalculation('2');">2</button>
    <button onclick=" updateCalculation('3');">3</button>
    <p>
        <button onclick=" updateCalculation('4');">4</button>
        <button onclick=" updateCalculation('5');">5</button>
        <button onclick=" updateCalculation('6');">6</button>
    </p>
    <p>
        <button onclick=" updateCalculation('7');">7</button>
        <button onclick=" updateCalculation('8');">8</button>
        <button onclick=" updateCalculation('9');">9</button>
    </p>
    <button onclick=" updateCalculation('0');">0</button>
    <button onclick=" updateCalculation('+');">+</button>


    <button onclick=" equalTo();">=</button>
    <button onclick=" resetCalculation();">Reset</button>
    <script>
        // eval(calculation); eval(...) converts the calculation string in to actual math   
        let calculation = localStorage.getItem('result') || '';
       
       

        function updateCalculation(value) {
            calculation = calculation + value;
            console.log(calculation);

            /*  - whenever we update the calculation, save it using .setItem()
            - when the page first loads, get the calcualtion using .getItem()
            - use a default value of ' ' if a calculation doesn't exist in local storage  */
            
            localStorage.setItem('result', calculation);
            let resultElm = document.querySelector('.js-result');
            resultElm.innerHTML = `${calculation}`;
        
        }

        // for equal to 
        function equalTo() {
            let result = eval(calculation); 
            console.log(`calculation is : ${result}`);
            let resultElm = document.querySelector('.js-result');
            resultElm.innerHTML = `${calculation} <br> Result is: ${result}`;
        }

        // to reset calculation
        function resetCalculation(){
            calculation = '';
            localStorage.removeItem('result');
            console.log('Reseted');
            let resultElm = document.querySelector('.js-result');
            resultElm.innerHTML = `0`;
        }

        // Whenever we update the calculation, display it on the page instead of in the console.
        // when the page first loads, if a calculation exists in localStorage, display it on the page.
        
        
    </script>
</body>

</html>
