<!--At a restaurant, you order 1 cofee ($5), 2 bagel ($3 each), and 1 soup ($9). Calculate the cost and save it in a variable called 'cost'. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let cost = 5 + (2*3) + 9;
        console.log(`Cost of food: $${cost}`);

        //lets say the restaurant charges a 10% tax
        let tax = cost * 0.1;
        console.log(`Tax(10%): $${tax}`);

        //calculate the total cost 
        let totalCost = cost + tax;
        console.log(`Total cos: $${totalCost}`);
    </script>
</body>
</html>
