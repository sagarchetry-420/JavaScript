<!-- Lets build a calculator -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="
        calculation = calculation + '1'; console.log(calculation);">1</button>
    <button onclick="
        calculation = calculation + '2'; console.log(calculation);">2</button>
    <button onclick="
        calculation = calculation +    '3'; console.log(calculation);">3</button>
    <p>
        <button onclick="
        calculation = calculation + '4'; console.log(calculation);">4</button>
        <button onclick="
        calculation = calculation + '5'; console.log(calculation);">5</button>
        <button onclick="
        calculation = calculation +    '6'; console.log(calculation);">6</button>
    </p>
    <p>
        <button onclick="
        calculation = calculation + '7'; console.log(calculation);">7</button>
        <button onclick="
        calculation = calculation + '8'; console.log(calculation);">8</button>
        <button onclick="
        calculation = calculation +    '9'; console.log(calculation);">9</button>
    </p>
    <button onclick="
        calculation = calculation +    '0'; console.log(calculation);">0</button>
    <button onclick="
        calculation = calculation + ' + '; console.log(calculation);">+</button>

    // eval(calculation); eval(...) converts the calculation string in to actual math
    <button onclick="result = eval(calculation); console.log(`calculation is : ${result}`);">=</button>
    <script>
        let calculation = '';

    </script>
</body>

</html>
