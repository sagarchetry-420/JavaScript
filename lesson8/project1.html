<!-- Rock Paper Scissors Game -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame('rock');">Rock</button>
    <button onclick="playGame('paper');">Paper</button>
    <button onclick="playGame('scissors');">scissors</button>
    <button onclick="scoreReset();">Reset Score</button>

    <script>

        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            loose: 0,
            tie: 0
        };

        /* if (!score) {
            score = {
                wins: 0,
                loose: 0,
                tie: 0
            };
        } */

        function playGame(youMove) {
            const computerMove = computerMovef();

            let result;

            // for your move scissors
            if (youMove === 'scissors') {
                if (computerMove === 'Rock') {
                    result = 'You loose';
                }
                else if (computerMove === 'Paper') {
                    result = 'You own';
                }
                else {
                    result = 'Tie';
                }
            }
            // for your move paper
            else if (youMove === 'paper') {
                if (computerMove === 'Rock') {
                    result = 'You own';
                }
                else if (computerMove === 'Paper') {
                    result = 'Tie';
                }
                else {
                    result = 'You loose';
                }
            }
            // for your move rock
            else if (youMove === 'rock') {
                if (computerMove === 'Rock') {
                    result = 'Tie';
                }
                else if (computerMove === 'Paper') {
                    result = 'You loose';
                }
                else {
                    result = 'You own';
                }
            }


            // for score

            if (result === 'You own') {
                score.wins++;
            }
            else if (result === 'You loose') {
                score.loose++;
            }
            else {
                score.tie++;
            }

            // using local storate to store
            localStorage.setItem('score', JSON.stringify(score));

            console.log(JSON.parse(localStorage.getItem('score')));

            alert(` Your move : ${youMove} \n Computer move: ${computerMove} \n\n ${result}
            wins: ${score.wins}, loose: ${score.loose}, tie: ${score.tie}`);
        }



        // for score reset button 

        function scoreReset() {
            score.loose = 0;
            score.wins = 0;
            score.tie = 0;

            localStorage.removeItem('score');

            console.log('reseted');
        }

        function computerMovef() {
            let computerMove;
            const randomNum = Math.random();
            if (randomNum >= 0 && randomNum < 1 / 3) {
                computerMove = 'Rock';
            }
            else if (randomNum >= 1 / 3 && randomNum < 2 / 3) {
                computerMove = 'Paper';
            }
            else {
                computerMove = 'Scissors';
            }
            return computerMove;
        }
    </script>
</body>

</html>
